<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130D" media="(prefers-color-scheme: dark)">
<title>Sorteio dos Síndicos — links</title>
<meta name="description" content="Central de links do Sorteio dos Síndicos: cadastro, sorteio, participantes e bônus surpresa.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%239C2B1B'/><g fill='white'><circle cx='50' cy='50' r='27'/><circle cx='40' cy='42' r='5' fill='%239C2B1B'/><circle cx='60' cy='48' r='4' fill='%239C2B1B'/><circle cx='47' cy='60' r='4.5' fill='%239C2B1B'/></g></svg>">
<style>
  :root {
    --paper:#F4EFE4; --surface:#FFFDF8; --ink:#241A10; --ink-soft:#6E6253;
    --rule:#D6CBB4; --marca:#9C2B1B; --marca-ink:#FFFDF8;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "Menlo", "Cascadia Mono", "Consolas", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#17130D; --surface:#241D15; --ink:#F3EDE2; --ink-soft:#A99E8D;
      --rule:#3A3123; --marca:#E8755A; --marca-ink:#17130D;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 2rem 1.1rem; -webkit-font-smoothing: antialiased;
  }
  .tudo { width: 100%; max-width: 26rem; display: flex; flex-direction: column; gap: 1.6rem; }

  header { display: flex; flex-direction: column; align-items: center; gap: .3rem; text-align: center; }
  .marca { font-family: var(--mono); font-size: .72rem; letter-spacing: .3em; text-transform: uppercase; color: var(--marca); font-weight: 700; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }

  .botoes { display: flex; flex-direction: column; gap: .75rem; }
  a.bt {
    display: block; text-align: center; text-decoration: none;
    background: var(--surface); color: var(--ink);
    border: 1.5px solid var(--rule); border-radius: 14px;
    padding: 1.15rem 1rem; font-size: 1.08rem; font-weight: 600;
  }
  a.bt:hover, a.bt:focus-visible { border-color: var(--marca); color: var(--marca); }
  a.bt:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
  a.bt:active { transform: scale(.985); }
</style>
</head>
<body>
  <div class="tudo">

    <header>
      <div class="marca">Holy Cook &middot; Piracicaba</div>
      <h1>Sorteio dos Síndicos</h1>
    </header>

    <nav class="botoes">
      <a class="bt" href="../cadastro/">Cadastro para o sorteio</a>
      <a class="bt" href="../sorteio/">Rodar sorteio</a>
      <a class="bt" href="../participantes/">Lista de participantes</a>
      <a class="bt" href="../bonus/">Envio de bônus surpresa</a>
    </nav>

  </div>
</body>
</html>
